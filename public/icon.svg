<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Verlassenes Krankenhaus: a dark hospital corridor ends in a lit doorway with a figure standing
       in it, under a red emergency light. One-point perspective, vanishing point (512, 580). The
       doorway, figure and lamp stay inside the central 80 % circle, so the art also works masked. -->
  <defs>
    <radialGradient id="bg" cx="512" cy="560" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18211f"/>
      <stop offset="0.5" stop-color="#0a0e0f"/>
      <stop offset="1" stop-color="#030405"/>
    </radialGradient>
    <linearGradient id="ceiling" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050607"/>
      <stop offset="1" stop-color="#151b1c"/>
    </linearGradient>
    <linearGradient id="wallL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050607"/>
      <stop offset="1" stop-color="#1d2526"/>
    </linearGradient>
    <linearGradient id="wallR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#050607"/>
      <stop offset="1" stop-color="#1d2526"/>
    </linearGradient>
    <linearGradient id="paintL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06100c"/>
      <stop offset="1" stop-color="#173a2e"/>
    </linearGradient>
    <linearGradient id="paintR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#06100c"/>
      <stop offset="1" stop-color="#173a2e"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2221"/>
      <stop offset="1" stop-color="#040506"/>
    </linearGradient>
    <linearGradient id="spill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bff5dd" stop-opacity="0.6"/>
      <stop offset="0.55" stop-color="#7fcfae" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#7fcfae" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4fff9"/>
      <stop offset="0.55" stop-color="#d2f5e5"/>
      <stop offset="1" stop-color="#9fdcc2"/>
    </linearGradient>
    <radialGradient id="doorGlow" cx="512" cy="590" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b6f7dc" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#5fae8e" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#5fae8e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redGlow" cx="512" cy="286" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff4a3a" stop-opacity="0.85"/>
      <stop offset="0.22" stop-color="#e0261c" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#8c0c08" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#5a0000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="512" cy="540" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.7"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect x="-400" y="-400" width="1824" height="1824" fill="url(#bg)"/>
  <g transform="translate(512 532) scale(1.14) translate(-512 -532)">

  <!-- Corridor surfaces, drawn past the edges so the art can be scaled down without gaps. -->
  <polygon points="372,330 652,330 1212,-670 -188,-670" fill="url(#ceiling)"/>
  <polygon points="372,330 -188,-670 -188,1830 372,830" fill="url(#wallL)"/>
  <polygon points="652,330 1212,-670 1212,1830 652,830" fill="url(#wallR)"/>
  <polygon points="372,830 652,830 1212,1830 -188,1830" fill="url(#floor)"/>
  <!-- Green lower wall paint, 30 % of the wall height. -->
  <polygon points="372,680 -188,1080 -188,1830 372,830" fill="url(#paintL)"/>
  <polygon points="652,680 1212,1080 1212,1830 652,830" fill="url(#paintR)"/>
  <!-- Bumper rails on top of the paint. -->
  <polygon points="372,674 -188,1066 -188,1088 372,684" fill="#2b3a35"/>
  <polygon points="652,674 1212,1066 1212,1088 652,684" fill="#2b3a35"/>

  <!-- Dead ceiling lights, receding towards the door. -->
  <g fill="#0b0d0e" stroke="#20292a" stroke-width="3">
    <polygon points="452,252 572,252 588,224 436,224"/>
    <polygon points="424,122 600,122 628,72 396,72"/>
  </g>
  <!-- Floor tile joints converging on the door. -->
  <g stroke="#000" stroke-opacity="0.45" stroke-width="4">
    <line x1="400" y1="830" x2="313" y2="1024"/>
    <line x1="456" y1="830" x2="413" y2="1024"/>
    <line x1="512" y1="830" x2="512" y2="1024"/>
    <line x1="568" y1="830" x2="611" y2="1024"/>
    <line x1="624" y1="830" x2="711" y2="1024"/>
    <line x1="352" y1="866" x2="672" y2="866"/>
    <line x1="326" y1="913" x2="698" y2="913"/>
    <line x1="288" y1="980" x2="736" y2="980"/>
  </g>

  <!-- Light from the doorway on the floor and the walls around it. -->
  <polygon points="372,830 652,830 761,1024 263,1024" fill="url(#spill)"/>
  <circle cx="512" cy="590" r="330" fill="url(#doorGlow)"/>

  <!-- The lit doorway and its dark frame. -->
  <rect x="372" y="330" width="280" height="500" fill="url(#door)"/>
  <rect x="372" y="330" width="280" height="500" fill="none" stroke="#050606" stroke-width="22"/>

  <!-- The Wärter, standing in the light. -->
  <g fill="#030404">
    <ellipse cx="519" cy="444" rx="27" ry="34" transform="rotate(-14 519 444)"/>
    <path d="M512 478 C536 479 556 488 566 504 C575 519 578 548 578 582 L583 762 C584 777 571 781 567 767 L560 604 L554 652 L548 830 L519 830 L512 724 L505 830 L476 830 L470 652 L464 604 L457 767 C453 781 440 777 441 762 L446 582 C446 548 449 519 458 504 C468 488 488 479 512 478 Z"/>
  </g>

  <!-- Red emergency light over the doorway. -->
  <circle cx="512" cy="286" r="330" fill="url(#redGlow)"/>
  <rect x="456" y="262" width="112" height="44" rx="14" fill="#ff3b2f" filter="url(#soft)"/>
  <rect x="470" y="270" width="84" height="28" rx="10" fill="#ff5a48"/>
  <rect x="482" y="276" width="60" height="10" rx="5" fill="#ffd2c8"/>

  </g>
  <rect x="-400" y="-400" width="1824" height="1824" fill="url(#vignette)"/>
</svg>
